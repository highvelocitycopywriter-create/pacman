<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pac-Man</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Pac-Man</h1>
    <div class="hud">
      <span>Score <strong id="score">0</strong></span>
      <span>High <strong id="high">0</strong></span>
      <span>Level <strong id="level">1</strong></span>
      <span>Lives <strong id="lives">3</strong></span>
    </div>
    <canvas id="game" width="560" height="620"></canvas>
    <div class="controls">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
      <button id="sound">Sound: On</button>
    </div>
    <div class="dpad" aria-label="Touch controls">
      <button data-dir="up" aria-label="Up">&#9650;</button>
      <button data-dir="left" aria-label="Left">&#9664;</button>
      <button data-dir="right" aria-label="Right">&#9654;</button>
      <button data-dir="down" aria-label="Down">&#9660;</button>
    </div>
    <p class="help">Arrow keys, WASD, swipe, or the on-screen pad to move. Enter starts, P pauses.</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
